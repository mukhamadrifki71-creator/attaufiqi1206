<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Hub</title>
  
  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      /* Background Full 100% tanpa ditutupi warna tema */
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    /* Header Navigasi Atas Transparan (Menu Atas) */
    header {
      width: 100%;
      padding: 15px 25px;
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .top-nav-link {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.15);
    }

    .top-nav-link:hover {
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      text-shadow: none;
    }

    /* Container Pintasan Menu Bulat Ala Google di Bawah */
    .shortcuts-container {
      margin-bottom: 40px;
      padding: 15px 25px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 90%;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      width: 75px;
      transition: transform 0.2s ease;
    }

    .shortcut-item:hover {
      transform: translateY(-5px);
    }

    .icon-circle {
      width: 54px;
      height: 54px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .shortcut-item:hover .icon-circle {
      background: #ffffff;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
    }

    .shortcut-label {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Menu Navigasi Atas (Header Transparan) -->
  <header>
    <nav class="top-nav">
      <a href="https://sekolah-anda.com" target="_blank" class="top-nav-link">🎓 Sekolah</a>
      <a href="https://drive.google.com" target="_blank" class="top-nav-link">📁 Berkas Saya</a>
      <a href="https://keluarga-anda.com" target="_blank" class="top-nav-link">👨‍👩‍👧‍👦 Keluarga</a>
      <a href="https://hobi-anda.com" target="_blank" class="top-nav-link">🎨 Hobi</a>
      <a href="https://pustaka-anda.com" target="_blank" class="top-nav-link">📚 Pustaka</a>
    </nav>
  </header>

  <!-- Area Tengah Kosong 100% Mengespos Foto Background -->
  <div></div>

  <!-- Pintasan Menu Melayang di Bawah Ala Google -->
  <div class="shortcuts-container">
    
    <!-- 1. Sekolah -->
    <a href="https://sekolah-anda.com" target="_blank" class="shortcut-item">
      <div class="icon-circle">🎓</div>
      <span class="shortcut-label">Sekolah</span>
    </a>

    <!-- 2. Berkas Saya -->
    <a href="https://drive.google.com" target="_blank" class="shortcut-item">
      <div class="icon-circle">📁</div>
      <span class="shortcut-label">Berkas Saya</span>
    </a>

    <!-- 3. Keluarga -->
    <a href="https://keluarga-anda.com" target="_blank" class="shortcut-item">
      <div class="icon-circle">👨‍👩‍👧‍👦</div>
      <span class="shortcut-label">Keluarga</span>
    </a>

    <!-- 4. Hobi & Sampingan -->
    <a href="https://hobi-anda.com" target="_blank" class="shortcut-item">
      <div class="icon-circle">🎨</div>
      <span class="shortcut-label">Hobi</span>
    </a>

    <!-- 5. Pustaka -->
    <a href="https://pustaka-anda.com" target="_blank" class="shortcut-item">
      <div class="icon-circle">📚</div>
      <span class="shortcut-label">Pustaka</span>
    </a>

  </div>

  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker Active:', reg.scope))
          .catch(err => console.error('PWA SW Error:', err));
      });
    }
  </script>

</body>
</html>
